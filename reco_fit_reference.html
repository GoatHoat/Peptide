<!doctype html>
<html><head><meta charset="utf-8">
<!--
  RECOMMENDER — FIT VARIANT
  All cards visible at once. No scrolling of any kind on this screen.

  Why this exists: the rail version needs a swipe before the viewer sees more
  than one recommendation. In a 5-second clip nobody swipes, so the payoff of
  the whole flow was never on screen. This version shows the full answer in
  the first frame.

  THINGS THAT BREAK SILENTLY IF CHANGED — see docs/GLASS_RULES.md
  1. backdrop-filter dies if ANY ancestor has filter/transform/perspective/
     will-change/opacity<1/isolation/contain:paint. A transform ON the card is
     fine. A transform on a WRAPPER around it is not. Entrance animations are
     the usual killer.
  2. The capsule (124px) is INTENTIONALLY larger than the disc (110px) and
     breaks its edge. .shot therefore has NO overflow:hidden, and the
     0.565-slicing rule does not apply here — there is nothing clipping it.
     Put overflow:hidden back and you get a flat cut across the outline.
  3. Particle phase comes from POSITION, never Math.random(). Random phase is
     noise, not a wave.
  4. Nothing on this screen scrolls. If content grows, shrink it — do not add
     overflow:auto back.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0E0E10;display:flex;align-items:center;justify-content:center;
       min-height:100vh;font-family:-apple-system,"Inter","Helvetica Neue",sans-serif;}
  .phone{width:402px;height:874px;background:#000;position:relative;
         overflow:hidden;border-radius:44px;}
  #pf{position:absolute;inset:0;width:402px;height:874px;}
  /* Glass only reads as glass if there is something behind it. Measured: a card
     over pure black renders mean-luminance 6 with stddev 0.00 — a perfect,
     invisible sheet of nothing. These wash layers exist so that EVERY card,
     across its whole width, has colour to lens. Move them and the cards go
     flat again. */
  .bloom{position:absolute;left:50%;top:-70px;transform:translateX(-50%);
    width:520px;height:420px;border-radius:50%;filter:blur(60px);
    background:radial-gradient(circle,rgba(206,138,92,.26),rgba(140,80,48,.08) 46%,transparent 70%);}
  .wash{position:absolute;left:-90px;right:-90px;top:150px;height:600px;
    filter:blur(64px);opacity:.95;
    background:
      radial-gradient(closest-side at 22% 12%,rgba(203,131,84,.30),transparent 100%),
      radial-gradient(closest-side at 88% 30%,rgba(190,118,76,.34),transparent 100%),
      radial-gradient(closest-side at 96% 55%,rgba(178,112,92,.26),transparent 100%),
      radial-gradient(closest-side at 12% 58%,rgba(170,110,150,.20),transparent 100%),
      radial-gradient(closest-side at 74% 82%,rgba(199,127,80,.24),transparent 100%),
      radial-gradient(closest-side at 40% 96%,rgba(150,100,164,.16),transparent 100%);}

  .status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;
          align-items:center;justify-content:space-between;padding:0 26px;z-index:6;
          font-size:15px;font-weight:600;color:#fff;letter-spacing:-.2px;}
  .prog{position:absolute;top:0;left:0;height:2px;width:62%;z-index:6;
        background:linear-gradient(90deg,#6E3D25,#B8784F 60%,#E3B08D);}

  h1{position:absolute;top:72px;left:24px;right:26px;z-index:5;
    font-size:33px;font-weight:700;line-height:1.14;letter-spacing:-1.02px;color:#fff;}
  .sub{position:absolute;top:160px;left:24px;right:44px;z-index:5;
    font-size:15px;line-height:1.45;color:rgba(255,255,255,.5);letter-spacing:-.1px;}

  /* fixed stack — nothing scrolls */
  .stack{position:absolute;top:200px;left:24px;right:24px;z-index:4;
    display:flex;flex-direction:column;gap:20px;}

  /* LIQUID GLASS.
     The fill is 2.5% white, not 7.5%. Anything heavier stops being glass and
     starts being a grey panel — on a near-black backdrop a white fill IS the
     opacity you see. The read comes from amplifying what is behind it
     (saturate + brightness on the backdrop), not from tinting the surface. */
  .card{position:relative;height:142px;border-radius:26px;overflow:hidden;
    display:flex;align-items:center;gap:14px;padding:0 14px;
    background:rgba(255,255,255,.025);
    transition:background .22s ease,box-shadow .22s ease;
    -webkit-backdrop-filter:blur(26px) saturate(300%) brightness(1.75) contrast(1.04);
            backdrop-filter:blur(26px) saturate(300%) brightness(1.75) contrast(1.04);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.20),      /* top specular */
      inset 1px 0 0 rgba(255,255,255,.07),      /* left catch */
      inset -1px 0 0 rgba(255,255,255,.04),
      inset 0 -1px 0 rgba(255,255,255,.055),    /* bottom bounce */
      0 10px 26px rgba(0,0,0,.42);}             /* lift off the backdrop */
  /* the bright bead along the top-left corner arc — this is the single tell
     that reads as "glass" rather than "translucent rectangle" */
  .card::before{content:"";position:absolute;inset:0;border-radius:26px;
    pointer-events:none;
    background:linear-gradient(133deg,rgba(255,255,255,.16),
      rgba(255,255,255,.04) 26%,transparent 46%,transparent 74%,
      rgba(255,255,255,.05));
    -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
            mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
    -webkit-mask-composite:xor;mask-composite:exclude;
    padding:1px;}
  .card.sel{background:rgba(226,176,141,.07);
    box-shadow:
      inset 0 1px 0 rgba(255,235,222,.30),
      inset 0 0 0 1px rgba(226,176,141,.26),
      inset 0 -1px 0 rgba(255,255,255,.06),
      0 10px 26px rgba(0,0,0,.42);}

  /* Countersunk disc. NOTE: no overflow:hidden — the capsule is deliberately
     larger than the disc and breaks its edge. That is the whole look, and it
     also means the 0.565-slicing rule does not apply here. */
  .shot{position:relative;flex:none;width:110px;height:110px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 36%,
      rgba(255,255,255,.075),rgba(255,255,255,.02) 62%,rgba(0,0,0,.28));
    box-shadow:inset 0 3px 8px rgba(0,0,0,.7),
               inset 0 -1px 0 rgba(255,255,255,.055);}
  /* CONTINUOUS ROTATION — sprite sheet + steps(). Never swap img.src on a
     timer; that decodes an image every frame and is visibly choppy.

     Sheet: 12 cols x 10 rows of square cells = 120 frames.
     Offsets MUST be in pixels, not percentages. Percentage background-position
     resolves against (container - image) size, so -1200% throws the sheet off
     canvas and you get an empty disc. --cell is set from JS on every layout,
     which is what keeps this responsive.

     Frame choice stops mattering once it moves: the foreshortened frames read
     as the pill turning edge-on, which is what is physically happening. The
     balance rule only governs which frame it RESTS on. */
  .cap{position:absolute;left:50%;top:50%;
    width:var(--cell);height:var(--cell);
    transform:translate(-50%,-50%) rotate(var(--rot,0deg));
    background-image:url(capsule_sheet.png);
    background-repeat:no-repeat;
    background-size:calc(var(--cell)*12) calc(var(--cell)*10);
    animation:spinx calc(var(--spin)/10) steps(12) infinite,
              spiny var(--spin) steps(10) infinite;
    animation-delay:var(--delay),var(--delay);
    will-change:background-position;   /* safe: .cap is INSIDE the card, not an
                                          ancestor, so it cannot kill the glass */
    backface-visibility:hidden;
    filter:contrast(1.14) brightness(.98)
           drop-shadow(0 8px 18px rgba(0,0,0,.9));}
  @keyframes spinx{from{background-position-x:0}
                     to{background-position-x:calc(var(--cell)*-12)}}
  @keyframes spiny{from{background-position-y:0}
                     to{background-position-y:calc(var(--cell)*-10)}}
  /* rests on a balanced frame (col 7, row 0 = frame 8) when motion is off */
  @media (prefers-reduced-motion:reduce){
    .cap{animation:none;
      background-position:calc(var(--cell)*-7) 0;}}

  /* 34px keeps the longest title clear of the tick at top-right */
  .meta{flex:1;min-width:0;padding-right:34px;}
  .meta h2{font-size:17px;font-weight:600;color:#fff;
    letter-spacing:-.45px;line-height:1.2;}
  .dose{margin-top:5px;font-size:12px;line-height:1.35;
    color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums;}
  .why{margin-top:8px;font-size:12.5px;line-height:1.36;letter-spacing:-.15px;
    color:rgba(255,255,255,.72);}

  .tick{position:absolute;top:14px;right:14px;z-index:4;width:26px;height:26px;
    border-radius:50%;border:1.5px solid rgba(255,255,255,.24);
    display:grid;place-items:center;transition:all .2s ease;}
  .tick svg{width:13px;height:13px;opacity:0;transition:opacity .2s ease;}
  .card.sel .tick{border-color:#E3B08D;background:#C08960;}
  .card.sel .tick svg{opacity:1;}

  /* not a card — plain text, so it can't read as an opaque slab */
  .out{position:absolute;left:24px;right:24px;z-index:4;
    font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.38);
    letter-spacing:-.1px;}
  .out b{color:rgba(255,255,255,.62);font-weight:500;}

  .scrim{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:5;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.8) 40%,#000 72%);
    pointer-events:none;}
  .cta{position:absolute;left:20px;right:20px;bottom:38px;height:56px;border-radius:28px;
    display:grid;place-items:center;z-index:7;font-size:16px;font-weight:600;
    letter-spacing:1.4px;text-transform:uppercase;color:#1A0E07;
    transition:opacity .2s ease;
    background:linear-gradient(162deg,#C79372,#A56A46 46%,#7A4A2C);
    box-shadow:0 1px 0 rgba(245,230,218,.55) inset,0 -1px 0 rgba(74,66,56,.5) inset;}
  .home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);z-index:8;
        width:140px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);}
</style></head>
<body>
<div class="phone">
  <div class="bloom"></div>
  <div class="wash"></div>
  <canvas id="pf" width="804" height="1748"></canvas>
  <div class="prog"></div>
  <div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>

  <h1>Recommendations<br>for you</h1>
  <div class="sub">Tap all the ones you want.</div>

  <div class="stack" id="stack"></div>

  <div class="out" id="out">
    <b>Left out: biotin, saw palmetto, keratin, silica, MSM, selenium.</b>
    Either you already get enough, or nobody has shown it works.
  </div>

  <div class="scrim"></div>
  <div class="cta" id="cta">Create schedule</div>
  <div class="home"></div>
</div>

<script>
// f = capsule frame (1-indexed). Pick by LIGHT/DARK BALANCE, not brightness.
// Measured across all 120 frames: frames 76-86 are 84% light pixels — the dark
// half is foreshortened behind the light one, so they render as a pale blob.
// Frames 3-13 and 55-65 are a true 50/50 split and read as a capsule.
// rot stands the pill up; the source frames are broadside horizontal.
const ITEMS=[
 {n:"Santa Cruz Copper + Zinc", d:"15 mg zinc &middot; 1 mg copper", f:8,  rot:-74,
  spin:"4s", delay:"0s",
  w:"Most zinc pills leave out copper."},
 {n:"Nordic Naturals Omega-3", d:"1,000 mg EPA + DHA", f:59, rot:68,
  spin:"4s", delay:"-1.333s",
  w:"Real EPA and DHA on the label."},
 {n:"Vital Proteins Collagen", d:"10 g peptides", f:11, rot:-61,
  spin:"4s", delay:"-2.667s",
  w:"Cheap and safe. Evidence is mixed."}
];

const stack=document.getElementById('stack');
stack.innerHTML=ITEMS.map((it,i)=>`
  <div class="card${i===0?' sel':''}" data-i="${i}">
    <div class="tick"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9.5 18 20 6.5"
      stroke="#1A0E07" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="shot"><div class="cap"
      style="--rot:${it.rot}deg;--spin:${it.spin};--delay:${it.delay};--cell:124px"></div></div>
    <div class="meta">
      <h2>${it.n}</h2>
      <div class="dose">${it.d}</div>
      <div class="why">${it.w}</div>
    </div>
  </div>`).join('');

// Card height DERIVES from available space. The 402x874 case lands on exactly
// 142 so the reference geometry is unchanged; shorter viewports shrink instead
// of overflowing. Nothing scrolls at any size.
const out=document.getElementById('out');
function layout(){
  const H=document.querySelector('.phone').clientHeight;
  const stackTop=stack.offsetTop;
  const ctaTop=H-38-56;
  const RESERVE=96;                    // footnote + breathing room above CTA
  const n=stack.children.length;
  const gap=n>3?14:20;
  stack.style.gap=gap+'px';
  const avail=ctaTop-stackTop-RESERVE-gap*(n-1);
  const cardH=Math.max(84,Math.min(142,Math.floor(avail/n)));
  [...stack.children].forEach(c=>{
    c.style.height=cardH+'px';
    // -32, not -36: at the reference cardH of 142 this yields exactly the
    // documented disc 110 / capsule 124. With -36 the subtraction binds before
    // the 110 cap ever does, and the disc silently caps at 106.
    const disc=Math.max(72,Math.min(110,cardH-32));
    const sh=c.querySelector('.shot');
    sh.style.width=sh.style.height=disc+'px';
    const cap=sh.querySelector('.cap');
    cap.style.setProperty('--cell',Math.round(disc*1.127)+'px');
    // below 118 the why line cannot fit under a two-line title
    c.querySelector('.why').style.display = cardH<118 ? 'none' : '';
  });
  out.style.top=(stack.offsetTop+stack.offsetHeight+20)+'px';
  return cardH;
}
window.__cardH=layout();
addEventListener('resize',()=>{window.__cardH=layout();});

const cards=[...stack.children];
cards.forEach(c=>c.addEventListener('click',()=>{c.classList.toggle('sel');count();}));
const cta=document.getElementById('cta');
function count(){
  const n=stack.querySelectorAll('.card.sel').length;
  cta.textContent = n ? 'Create schedule · '+n : 'Create schedule';
  cta.style.opacity = n ? 1 : .45;
}
count();

const cv=document.getElementById('pf'),cx=cv.getContext('2d');
const W=402,H=874,N=330; cx.scale(2,2);
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const P=Array.from({length:N},()=>{
  const x=rnd()*W, y=H*(0.06+rnd()*1.0);
  return {x,y,r:0.5+rnd()*1.5,a:0.34+rnd()*0.62,
    amp:13+rnd()*11,
    // phase comes from POSITION, not random — this is what makes it a wave.
    ph:(x/W)*Math.PI*1.7 + (y/H)*Math.PI*0.55};
});
function draw(t){
  cx.clearRect(0,0,W,H); const wave=t/2600;
  for(const p of P){
    const dy=Math.sin(wave+p.ph)*p.amp;
    const dx=Math.cos(wave*0.5+p.ph)*p.amp*0.34;
    const fall=Math.min(1,Math.max(0.28,(p.y/H-0.02)/0.72));
    const crest=0.40+0.60*Math.sin(wave+p.ph);
    const o=p.a*fall*fall*crest;
    const g=cx.createRadialGradient(p.x+dx,p.y+dy,0,p.x+dx,p.y+dy,p.r*2.6);
    g.addColorStop(0,`rgba(240,205,175,${o*0.55})`); g.addColorStop(1,'rgba(226,176,141,0)');
    cx.fillStyle=g; cx.beginPath(); cx.arc(p.x+dx,p.y+dy,p.r*2.6,0,7); cx.fill();
    cx.fillStyle=`rgba(243,214,188,${Math.min(1,o*1.45)})`;
    cx.beginPath(); cx.arc(p.x+dx,p.y+dy,p.r,0,7); cx.fill();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Pepstack</title>
    <!-- The redirect, without JavaScript. Some in-app browsers block scripts;
         this fires anyway and is the reason the page exists. -->
    <meta http-equiv="refresh" content="0; url=pepstack://checkout/done" />
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        text-align: center;
        padding: 0 28px;
        -webkit-font-smoothing: antialiased;
        font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
      }
      main { max-width: 320px; }
      h1 { margin: 0 0 10px; font-size: 22px; font-weight: 600; letter-spacing: -0.4px; }
      p { margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: rgba(255, 255, 255, 0.62); }
      a {
        display: inline-block;
        margin-top: 22px;
        padding: 13px 22px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 14px;
        color: #7b5cfa;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Payment received</h1>
      <p>Taking you back to the app.</p>
      <p>Your subscription is being activated. If this page stays open, use the link below.</p>
      <!-- Visible, not a fallback that only appears on failure: the automatic
           redirect is silent when it is blocked, and a dead end is worse than
           a link that was not needed. -->
      <a href="pepstack://checkout/done">Return to the app</a>
    </main>
  </body>
</html>
